# Release Please: automated versioning, CHANGELOG.md and GitHub Releases.
#
# On every push to main, Release Please reads the Conventional Commits since the
# last release and opens (or updates) a "chore(main): release X.Y.Z" pull request
# that bumps package.json, .release-please-manifest.json and CHANGELOG.md.
# Merging that PR creates the vX.Y.Z tag and publishes the GitHub Release.
#
# Configuration lives in release-please-config.json and .release-please-manifest.json.
#
# Optional repository secret:
#   RELEASE_PLEASE_TOKEN - fine-grained PAT (this repository only; Contents, Pull requests
#                          and Issues: read & write) or a classic PAT with `repo` scope.
#                          Pull requests opened with the default GITHUB_TOKEN do not trigger
#                          other workflows, so without this secret CI does not run on release
#                          PRs (close and reopen the PR, or re-run CI manually).
#                          Falls back to GITHUB_TOKEN when unset.
# With the GITHUB_TOKEN fallback, enable Settings -> Actions -> General ->
# "Allow GitHub Actions to create and approve pull requests".
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summary
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          HTML_URL: ${{ steps.release.outputs.html_url }}
        run: |
          echo "Released ${TAG_NAME}: ${HTML_URL}" >> "$GITHUB_STEP_SUMMARY"
