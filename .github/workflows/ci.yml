name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Dummy public values so the Vite build can inline VITE_* variables.
  # They are never used to talk to a real backend in CI.
  VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
  SUPABASE_URL: https://ci-placeholder.supabase.co
  SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Formatting is checked by the `format` job, so the prettier/prettier
      # ESLint rule is disabled here to keep lint output focused on real issues.
      - name: Run ESLint
        run: |
          bunx eslint . --rule '{"prettier/prettier": "off"}'

  format:
    name: Format (Prettier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # TODO(format): the codebase imported from Lovable is not yet Prettier-formatted
    # (77 files at the time this workflow was added). Remove `continue-on-error`
    # after a one-off `bun run format` commit so formatting becomes blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: bunx prettier --check .

  typecheck:
    name: Typecheck (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # src/routeTree.gen.ts is committed (generated by the TanStack Router
      # plugin during dev/build), so no generation step is needed before tsc.
      - name: Run TypeScript
        run: bunx tsc --noEmit

  test:
    name: Test (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Run tests
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Build
        run: bun run build
      - name: Verify generated route tree is committed
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            echo "::error file=src/routeTree.gen.ts::routeTree.gen.ts changed during the build. Run 'bun run build' (or 'bun run dev') locally and commit the regenerated file."
            git --no-pager diff --stat -- src/routeTree.gen.ts
            exit 1
          fi

  migrations:
    name: Migrations journal
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Check drizzle journal consistency
        run: node scripts/check-migrations.mjs
