name: Feature request
description: Suggest an idea or improvement.
title: "feat: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Mention affected views (list, kanban, calendar, timeline, notes, ...).
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: scope
    attributes:
      label: Does this need database changes?
      options:
        - "No"
        - "Yes – new table/column or RLS change"
        - "Not sure"

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, links, prior art.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this myself.
