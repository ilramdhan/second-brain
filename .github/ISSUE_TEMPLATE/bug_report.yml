name: Bug report
description: Something is broken or behaves unexpectedly.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.
        **Security issues must not be reported here.** Use the private advisory form linked in SECURITY.md.
        Please remove any personal data, tokens or private note contents from logs and screenshots.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Tasks → Kanban
        2. Drag a task to "Done"
        3. ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Inbox / AI capture
        - Tasks – list
        - Tasks – kanban
        - Tasks – calendar
        - Tasks – timeline
        - Dependencies / automations
        - Notes editor / links / graph
        - Note collaboration (realtime)
        - Projects / team sharing
        - Archive / trash / templates
        - Google Calendar
        - Telegram bot
        - Auth / login
        - PWA / offline / install
        - Accessibility
        - Build / deployment
        - Other
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Where are you running it?
      options:
        - Local dev (bun run dev)
        - Self-hosted (Vercel)
        - Self-hosted (other)
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / OS / device
      placeholder: e.g. Chrome 140 on macOS 26, Safari on iOS 26 (installed PWA)

  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Output of `git rev-parse --short HEAD`, or the release version.

  - type: textarea
    id: logs
    attributes:
      label: Logs, console output or screenshots
      description: Browser console / server logs. Redact secrets and personal data.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed secrets and personal data from this report.
          required: true
